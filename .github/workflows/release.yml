name: Manual source build validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - name: Prepare Android tools
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.1' 'ndk;27.0.12077973'
      - name: Build core from pinned sources and patches
        run: bash ./run lib core
      - name: Check Android source and Debug build
        run: ./gradlew --no-daemon testOssDebugUnitTest assembleOssDebug processOssReleaseMainManifest
      # No artifact upload, commit, push, PR or Release operation. Publishing requires separate human approval.
